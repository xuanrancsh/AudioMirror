AudioMirror.Title="Audio Multi-Device Monitor"
AudioMirror.Menu.ShowHide="Audio Multi-Device Monitor"
AudioMirror.Hotkey.Toggle="Start/Stop multi-device monitoring"

AudioMirror.Window.Header="Monitor everything your PC outputs (desktop audio only, microphone excluded) to multiple devices at once, with low latency. Up to 5 devices; picking a device starts monitoring to it."
AudioMirror.Window.SlotEnable="Enable"
AudioMirror.Window.SlotEnableTip="Check to start monitoring desktop audio to the device chosen in this slot; uncheck to stop (the device choice is kept)."
AudioMirror.Window.SlotDeviceTip="Pick the output device to monitor. The default playback device cannot be selected (sound already plays there)."
AudioMirror.Window.SlotVolumeTip="Affects only the volume sent to this device; does not change the OBS mixer."
AudioMirror.Window.AutoStart="Auto-start monitoring when OBS runs"
AudioMirror.Window.AutoStartTip="When checked, every OBS launch automatically starts monitoring with the 5 slots' current selections; when unchecked, everything is manual."
AudioMirror.Window.AutoOpen="Open this panel when OBS starts"
AudioMirror.Window.AutoOpenTip="When checked, this panel pops up automatically on every OBS launch."
AudioMirror.Window.AddSource="Add desktop audio capture automatically"
AudioMirror.Window.NoDevice="(select a device)"
AudioMirror.Window.DefaultDevice="(current default playback device, sound already plays here)"
AudioMirror.Window.UsedDevice="(already used by another slot)"
AudioMirror.Window.Tip="Tips: desktop audio only, microphone excluded, no need to mute the OBS mic; Bluetooth devices have 150-300ms of hardware latency; keep the Windows master volume at 100%, otherwise the captured level drops with it."

